syntax = "proto3";

package catur.user.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/Vaziria/pkl/backend/gen/catur/user/v1;userv1";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}

message RegisterRequest {
  string email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 254
  }];

  string username = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 32
    pattern: "^[a-zA-Z0-9_]+$"
  }];

  string password = 3 [(buf.validate.field).string = {
    min_len: 8
    max_len: 72
  }];
}

message RegisterResponse {
  string name = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}
